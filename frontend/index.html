<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadence — Obsidian-Style Notes & Reminders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-app: #161616;
      --bg-sidebar: #1b1b1b;
      --bg-list: #1e1e1e;
      --bg-editor: #202020;
      --bg-hover: #2a2a2a;
      --bg-active: #2f2c3a;
      --bg-input: #171717;
      --border: #2e2e2e;
      --border-strong: #3e3e3e;
      --text-primary: #dcddde;
      --text-secondary: #999999;
      --text-muted: #666666;
      --accent: #7f6df2;
      --accent-hover: #8e7ef5;
      --accent-soft: rgba(127, 109, 242, 0.16);
      --emerald: #4ade80;
      --emerald-bg: rgba(74, 222, 128, 0.14);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.14);
      --rose: #fb7185;
      --rose-bg: rgba(251, 113, 133, 0.14);
    }

    :root[data-theme="light"] {
      --bg-app: #f2f3f5;
      --bg-sidebar: #f6f6f7;
      --bg-list: #fafafa;
      --bg-editor: #ffffff;
      --bg-hover: #ececef;
      --bg-active: #ece8fc;
      --bg-input: #f4f4f6;
      --border: #e2e2e6;
      --border-strong: #cfcfd6;
      --text-primary: #222222;
      --text-secondary: #5c5c66;
      --text-muted: #8e8e98;
      --accent: #6c5ce7;
      --accent-hover: #5b4bc4;
      --accent-soft: rgba(108, 92, 231, 0.12);
      --emerald: #15803d;
      --emerald-bg: #dcfce7;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --rose: #be123c;
      --rose-bg: #ffe4e6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 230px 320px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 200px 1fr;
        grid-template-rows: 46vh 54vh;
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      .editor-pane {
        grid-column: 1 / -1;
        border-top: 1px solid var(--border);
      }
    }

    @media (max-width: 640px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
    }

    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 10px;
      overflow-y: auto;
    }

    .vault-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .vault-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
    }

    .vault-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .new-note-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
      transition: background 0.15s;
    }

    .new-note-btn:hover {
      background: var(--accent-hover);
    }

    .nav-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 6px 8px 4px;
    }

    .nav-item {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      margin-bottom: 2px;
      font-family: inherit;
    }

    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-active);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-count {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-family: "JetBrains Mono", monospace;
    }

    .nav-item.overdue-item .nav-count {
      color: var(--rose);
      font-weight: 600;
    }

    .tag-list {
      max-height: 240px;
      overflow-y: auto;
      margin-top: 2px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      gap: 6px;
    }

    .icon-toggle {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .icon-toggle:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .list-pane {
      background: var(--bg-list);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-toolbar {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-row {
      display: flex;
      gap: 6px;
    }

    .search-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-family: inherit;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filter-select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.78rem;
      font-family: inherit;
    }

    .notes-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .note-row {
      padding: 10px 11px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .note-row:hover {
      background: var(--bg-hover);
    }

    .note-row.selected {
      background: var(--bg-active);
      border-color: rgba(127, 109, 242, 0.45);
    }

    .note-row.pinned-row {
      border-left: 2px solid var(--accent);
    }

    .note-row.completed .row-title {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .row-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .pin-badge {
      font-size: 0.68rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "JetBrains Mono", monospace;
      flex-shrink: 0;
    }

    .row-title {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .priority-dot.High { background: var(--rose); }
    .priority-dot.Medium { background: var(--amber); }
    .priority-dot.Low { background: var(--emerald); }

    .row-snippet {
      font-size: 0.78rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: "JetBrains Mono", monospace;
    }

    .row-tag {
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .row-due.overdue { color: var(--rose); font-weight: 600; }
    .row-due.today { color: var(--amber); font-weight: 600; }

    .editor-pane {
      background: var(--bg-editor);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .editor-topbar {
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .breadcrumb {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: "JetBrains Mono", monospace;
    }

    .editor-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .btn-pin.active-pin {
      color: var(--accent);
      border-color: rgba(127, 109, 242, 0.45);
      background: var(--accent-soft);
    }

    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .btn-accent:hover {
      background: var(--accent-hover);
    }

    .btn-done {
      color: var(--emerald);
      border-color: rgba(74, 222, 128, 0.35);
      background: var(--emerald-bg);
    }

    .btn-danger {
      color: var(--rose);
    }

    .btn-danger:hover {
      background: var(--rose-bg);
      border-color: rgba(251, 113, 133, 0.35);
    }

    .editor-canvas {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 32px 60px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .doc-title-input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      padding: 0 0 14px;
      width: 100%;
      font-family: inherit;
    }

    .doc-title-input:focus {
      outline: none;
    }

    .properties-box {
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    .properties-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .properties-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 760px) {
      .properties-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .prop-field label {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-family: "JetBrains Mono", monospace;
    }

    .prop-field input,
    .prop-field select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 0.82rem;
      font-family: inherit;
    }

    .prop-field input:focus,
    .prop-field select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .quick-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .quick-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick-bar span {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: "JetBrains Mono", monospace;
    }

    .pin-checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-secondary);
      font-family: "JetBrains Mono", monospace;
      cursor: pointer;
    }

    .chip {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.74rem;
      cursor: pointer;
      font-family: "JetBrains Mono", monospace;
    }

    .chip:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .doc-body-textarea {
      flex: 1;
      min-height: 280px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.7;
      resize: vertical;
      padding: 4px 0;
      width: 100%;
    }

    .doc-body-textarea:focus {
      outline: none;
    }

    .markdown-preview {
      line-height: 1.7;
      font-size: 0.95rem;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .markdown-preview a {
      color: var(--accent);
      text-decoration: underline;
    }

    .empty-feed {
      text-align: center;
      padding: 36px 14px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: var(--accent);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 90;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      background: var(--rose);
    }
  </style>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar">
      <div>
        <div class="vault-header">
          <div class="vault-brand">
            <div class="vault-icon">C</div>
            <span>Cadence Vault</span>
          </div>
        </div>

        <button type="button" class="new-note-btn" onclick="startNewNote()">
          <span>+ New Note</span>
        </button>

        <div class="nav-section-label">Views</div>
        <div id="viewNav">
          <button type="button" class="nav-item active" data-view="all">
            <span>All Notes</span>
            <span class="nav-count" id="countAll">0</span>
          </button>
          <button type="button" class="nav-item" data-view="pinned">
            <span>Pinned</span>
            <span class="nav-count" id="countPinned">0</span>
          </button>
          <button type="button" class="nav-item" data-view="today">
            <span>Today</span>
            <span class="nav-count" id="countToday">0</span>
          </button>
          <button type="button" class="nav-item overdue-item" data-view="overdue">
            <span>Overdue</span>
            <span class="nav-count" id="countOverdue">0</span>
          </button>
          <button type="button" class="nav-item" data-view="upcoming">
            <span>Next 24h</span>
            <span class="nav-count" id="countUpcoming">0</span>
          </button>
          <button type="button" class="nav-item" data-view="completed">
            <span>Completed</span>
            <span class="nav-count" id="countCompleted">0</span>
          </button>
        </div>

        <div class="nav-section-label" style="margin-top: 14px;">Tags</div>
        <div class="tag-list" id="tagNav"></div>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="icon-toggle" id="soundToggleBtn" onclick="toggleSound()">🔔 Sound</button>
        <button type="button" class="icon-toggle" id="themeToggleBtn" onclick="toggleTheme()">☀️ Light</button>
      </div>
    </aside>

    <section class="list-pane">
      <div class="list-toolbar">
        <div class="search-row">
          <input id="searchInput" class="search-input" type="text" placeholder="Search vault (press /)..." oninput="renderNotesList()" />
          <select id="filterPriority" class="filter-select" onchange="renderNotesList()">
            <option value="">All</option>
            <option value="High">High</option>
            <option value="Medium">Med</option>
            <option value="Low">Low</option>
          </select>
        </div>
      </div>

      <div class="notes-feed" id="notesFeed">
        <div class="empty-feed">Loading vault...</div>
      </div>
    </section>

    <main class="editor-pane">
      <div class="editor-topbar">
        <div class="breadcrumb" id="editorBreadcrumb">Cadence / New Note</div>
        <div class="editor-actions">
          <button type="button" class="btn btn-pin" id="pinNoteBtn" onclick="togglePinActiveNote()">Pin</button>
          <button type="button" class="btn" id="previewToggleBtn" onclick="togglePreviewMode()">Preview</button>
          <button type="button" class="btn" id="snooze15Btn" style="display:none;" onclick="snoozeActiveNote(15)">+15m</button>
          <button type="button" class="btn" id="snooze60Btn" style="display:none;" onclick="snoozeActiveNote(60)">+1h</button>
          <button type="button" class="btn btn-done" id="toggleDoneBtn" style="display:none;" onclick="toggleActiveComplete()">Done</button>
          <button type="button" class="btn btn-danger" id="deleteNoteBtn" style="display:none;" onclick="deleteActiveNote()">Delete</button>
          <button type="button" class="btn btn-accent" onclick="saveActiveNote()">Save Note</button>
        </div>
      </div>

      <div class="editor-canvas">
        <input id="docTitle" class="doc-title-input" type="text" maxlength="150" placeholder="Untitled Note..." />

        <div class="properties-box">
          <div class="properties-header">
            <span>Properties</span>
            <span>AI auto-tags if Tag = General</span>
          </div>
          <div class="properties-grid">
            <div class="prop-field">
              <label for="docPriority">priority</label>
              <select id="docPriority">
                <option value="Medium" selected>Medium (Auto AI)</option>
                <option value="High">High</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="prop-field">
              <label for="docTag">tag</label>
              <input id="docTag" type="text" maxlength="50" value="General" placeholder="General" />
            </div>
            <div class="prop-field">
              <label for="docReminderDate">reminder_date</label>
              <input id="docReminderDate" type="date" />
            </div>
            <div class="prop-field">
              <label for="docReminderTime">reminder_time</label>
              <input id="docReminderTime" type="time" />
            </div>
          </div>

          <div class="quick-bar">
            <div class="quick-group">
              <span>quick_set:</span>
              <button type="button" class="chip" onclick="setQuickReminder('1h')">+1h</button>
              <button type="button" class="chip" onclick="setQuickReminder('tonight')">tonight 8pm</button>
              <button type="button" class="chip" onclick="setQuickReminder('tomorrow')">tomorrow 9am</button>
              <button type="button" class="chip" onclick="setQuickReminder('clear')">clear</button>
            </div>
            <label class="pin-checkbox-label">
              <input type="checkbox" id="docPinned" />
              <span>pin_to_top</span>
            </label>
          </div>
        </div>

        <textarea id="docContent" class="doc-body-textarea" placeholder="Write markdown notes, links, or checklist items (- [ ] task)..."></textarea>
        <div id="docPreview" class="markdown-preview" style="display:none;"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = window.location.origin;
    let allNotes = [];
    let currentView = "all";
    let selectedTag = "";
    let activeNoteId = null;
    let isPreviewMode = false;

    let currentTheme = localStorage.getItem("cadence_theme") || "dark";
    let soundEnabled = localStorage.getItem("cadence_sound_enabled") !== "false";
    const alertedIds = new Set(
      JSON.parse(sessionStorage.getItem("cadence_alerted_ids") || "[]")
    );

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("cadence_theme", theme);
      const btn = document.getElementById("themeToggleBtn");
      if (btn) btn.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
    }

    function toggleTheme() {
      applyTheme(currentTheme === "dark" ? "light" : "dark");
    }

    function applySoundState() {
      const btn = document.getElementById("soundToggleBtn");
      if (btn) btn.textContent = soundEnabled ? "🔔 Sound" : "🔕 Muted";
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem("cadence_sound_enabled", String(soundEnabled));
      applySoundState();
      showToast(soundEnabled ? "Reminder sound enabled." : "Reminder sound muted.");
    }

    function playChime() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (_) {}
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `toast show ${isError ? "error" : ""}`;
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function toDateInputValue(dateObj) {
      const pad = n => String(n).padStart(2, "0");
      return `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())}`;
    }

    function toTimeInputValue(dateObj) {
      const pad = n => String(n).padStart(2, "0");
      return `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
    }

    function combineDateTimeToIso(dateStr, timeStr) {
      if (!dateStr && !timeStr) return null;
      const finalDate = dateStr || toDateInputValue(new Date());
      const finalTime = timeStr || "09:00";
      const dt = new Date(`${finalDate}T${finalTime}`);
      return Number.isNaN(dt.getTime()) ? null : dt.toISOString();
    }

    function setQuickReminder(preset) {
      const dateInput = document.getElementById("docReminderDate");
      const timeInput = document.getElementById("docReminderTime");
      if (preset === "clear") {
        dateInput.value = "";
        timeInput.value = "";
        return;
      }
      const d = new Date();
      if (preset === "1h") {
        d.setHours(d.getHours() + 1);
      } else if (preset === "tonight") {
        d.setHours(20, 0, 0, 0);
        if (d <= new Date()) d.setDate(d.getDate() + 1);
      } else if (preset === "tomorrow") {
        d.setDate(d.getDate() + 1);
        d.setHours(9, 0, 0, 0);
      }
      dateInput.value = toDateInputValue(d);
      timeInput.value = toTimeInputValue(d);
    }

    function syncPinButton(isPinned) {
      const pinBtn = document.getElementById("pinNoteBtn");
      if (!pinBtn) return;
      pinBtn.textContent = isPinned ? "Pinned" : "Pin";
      pinBtn.classList.toggle("active-pin", Boolean(isPinned));
    }

    function updateSidebarCounts() {
      const now = new Date();
      const next24h = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      let pinned = 0, today = 0, overdue = 0, upcoming = 0, completed = 0;
      const tagMap = {};

      allNotes.forEach(n => {
        const tag = (n.tag || "General").trim();
        tagMap[tag] = (tagMap[tag] || 0) + 1;

        if (n.is_pinned) pinned++;

        if (n.is_completed) {
          completed++;
          return;
        }
        if (n.reminder_at) {
          const rem = new Date(n.reminder_at);
          if (rem < now) overdue++;
          if (
            rem.getFullYear() === now.getFullYear() &&
            rem.getMonth() === now.getMonth() &&
            rem.getDate() === now.getDate()
          ) today++;
          if (rem >= now && rem <= next24h) upcoming++;
        }
      });

      document.getElementById("countAll").textContent = allNotes.length;
      document.getElementById("countPinned").textContent = pinned;
      document.getElementById("countToday").textContent = today;
      document.getElementById("countOverdue").textContent = overdue;
      document.getElementById("countUpcoming").textContent = upcoming;
      document.getElementById("countCompleted").textContent = completed;

      const tagNav = document.getElementById("tagNav");
      const tags = Object.keys(tagMap).sort((a, b) => a.localeCompare(b));
      tagNav.innerHTML = tags.map(tag => `
        <button type="button" class="nav-item ${selectedTag === tag ? "active" : ""}" onclick="selectTagFilter('${escapeHtml(tag)}')">
          <span>#${escapeHtml(tag)}</span>
          <span class="nav-count">${tagMap[tag]}</span>
        </button>
      `).join("");
    }

    function selectTagFilter(tag) {
      selectedTag = selectedTag === tag ? "" : tag;
      updateSidebarCounts();
      renderNotesList();
    }

    document.getElementById("viewNav").addEventListener("click", (e) => {
      const btn = e.target.closest(".nav-item");
      if (!btn) return;
      document.querySelectorAll("#viewNav .nav-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view;
      selectedTag = "";
      updateSidebarCounts();
      renderNotesList();
    });

    function getDueBadge(note) {
      if (!note.reminder_at) return { cls: "", text: "" };
      const rem = new Date(note.reminder_at);
      const now = new Date();
      const timeStr = rem.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const dateStr = rem.toLocaleDateString([], { month: "short", day: "numeric" });

      if (note.is_completed) return { cls: "", text: `${dateStr} ${timeStr}` };
      if (rem < now) return { cls: "overdue", text: `Overdue ${dateStr}` };
      const isToday =
        rem.getFullYear() === now.getFullYear() &&
        rem.getMonth() === now.getMonth() &&
        rem.getDate() === now.getDate();
      return isToday
        ? { cls: "today", text: `Today ${timeStr}` }
        : { cls: "", text: `${dateStr} ${timeStr}` };
    }

    function renderNotesList() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const priorityFilter = document.getElementById("filterPriority").value;
      const now = new Date();
      const next24h = new Date(now.getTime() + 24 * 60 * 60 * 1000);

      const filtered = allNotes
        .filter(note => {
          if (selectedTag && (note.tag || "General") !== selectedTag) return false;
          if (!selectedTag) {
            if (currentView === "pinned" && !note.is_pinned) return false;
            if (currentView === "completed" && !note.is_completed) return false;
            if (currentView !== "completed" && currentView !== "all" && note.is_completed) return false;

            if (currentView === "today") {
              if (!note.reminder_at) return false;
              const rem = new Date(note.reminder_at);
              if (
                rem.getFullYear() !== now.getFullYear() ||
                rem.getMonth() !== now.getMonth() ||
                rem.getDate() !== now.getDate()
              ) return false;
            }
            if (currentView === "overdue") {
              if (!note.reminder_at || new Date(note.reminder_at) >= now) return false;
            }
            if (currentView === "upcoming") {
              if (!note.reminder_at) return false;
              const rem = new Date(note.reminder_at);
              if (rem < now || rem > next24h) return false;
            }
          }

          if (priorityFilter && note.priority !== priorityFilter) return false;

          if (search) {
            const hay = `${note.title} ${note.content || ""} ${note.tag || ""}`.toLowerCase();
            if (!hay.includes(search)) return false;
          }
          return true;
        })
        .sort((a, b) => Number(Boolean(b.is_pinned)) - Number(Boolean(a.is_pinned)));

      const feed = document.getElementById("notesFeed");
      if (!filtered.length) {
        feed.innerHTML = `<div class="empty-feed">No matching notes in this view.</div>`;
        return;
      }

      feed.innerHTML = filtered.map(note => {
        const due = getDueBadge(note);
        return `
          <div class="note-row ${note.id === activeNoteId ? "selected" : ""} ${note.is_pinned ? "pinned-row" : ""} ${note.is_completed ? "completed" : ""}" onclick="selectNote(${note.id})">
            <div class="row-header">
              <div class="row-title-wrap">
                ${note.is_pinned ? `<span class="pin-badge">PIN</span>` : ""}
                <span class="row-title">${escapeHtml(note.title)}</span>
              </div>
              <span class="priority-dot ${escapeHtml(note.priority)}"></span>
            </div>
            <div class="row-snippet">${escapeHtml(note.content || "No additional details")}</div>
            <div class="row-meta">
              <span class="row-tag">#${escapeHtml(note.tag || "General")}</span>
              ${due.text ? `<span class="row-due ${due.cls}">${due.text}</span>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    function startNewNote() {
      activeNoteId = null;
      isPreviewMode = false;
      updatePreviewUI();
      document.getElementById("editorBreadcrumb").textContent = "Cadence / New Note";
      document.getElementById("docTitle").value = "";
      document.getElementById("docPriority").value = "Medium";
      document.getElementById("docTag").value = "General";
      document.getElementById("docReminderDate").value = "";
      document.getElementById("docReminderTime").value = "";
      document.getElementById("docPinned").checked = false;
      document.getElementById("docContent").value = "";
      syncPinButton(false);
      document.getElementById("toggleDoneBtn").style.display = "none";
      document.getElementById("deleteNoteBtn").style.display = "none";
      document.getElementById("snooze15Btn").style.display = "none";
      document.getElementById("snooze60Btn").style.display = "none";
      renderNotesList();
      document.getElementById("docTitle").focus();
    }

    function selectNote(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      activeNoteId = note.id;
      document.getElementById("editorBreadcrumb").textContent = `Cadence / #${note.tag || "General"} / ${note.title}`;
      document.getElementById("docTitle").value = note.title;
      document.getElementById("docPriority").value = note.priority || "Medium";
      document.getElementById("docTag").value = note.tag || "General";
      document.getElementById("docContent").value = note.content || "";
      document.getElementById("docPinned").checked = Boolean(note.is_pinned);
      syncPinButton(note.is_pinned);

      const remObj = note.reminder_at ? new Date(note.reminder_at) : null;
      document.getElementById("docReminderDate").value = remObj ? toDateInputValue(remObj) : "";
      document.getElementById("docReminderTime").value = remObj ? toTimeInputValue(remObj) : "";

      const doneBtn = document.getElementById("toggleDoneBtn");
      doneBtn.style.display = "inline-block";
      doneBtn.textContent = note.is_completed ? "Reopen" : "Done";

      document.getElementById("deleteNoteBtn").style.display = "inline-block";
      const hasRem = Boolean(note.reminder_at && !note.is_completed);
      document.getElementById("snooze15Btn").style.display = hasRem ? "inline-block" : "none";
      document.getElementById("snooze60Btn").style.display = hasRem ? "inline-block" : "none";

      if (isPreviewMode) renderMarkdownPreview();
      renderNotesList();
    }

    async function togglePinActiveNote() {
      const pinCheckbox = document.getElementById("docPinned");
      const nextPinned = !pinCheckbox.checked;
      pinCheckbox.checked = nextPinned;
      syncPinButton(nextPinned);

      if (activeNoteId === null) return;

      try {
        const res = await fetch(`${API_BASE}/notes/${activeNoteId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ is_pinned: nextPinned })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadNotes(false);
        showToast(nextPinned ? "Note pinned to top." : "Note unpinned.");
      } catch (err) {
        showToast(`Pin update failed: ${err.message}`, true);
      }
    }

    async function saveActiveNote() {
      const title = document.getElementById("docTitle").value.trim();
      if (!title) {
        showToast("Title is required.", true);
        document.getElementById("docTitle").focus();
        return;
      }
      const priority = document.getElementById("docPriority").value;
      const tag = document.getElementById("docTag").value.trim() || "General";
      const content = document.getElementById("docContent").value.trim() || null;
      const is_pinned = document.getElementById("docPinned").checked;
      const dateStr = document.getElementById("docReminderDate").value;
      const timeStr = document.getElementById("docReminderTime").value;
      const reminder_at = combineDateTimeToIso(dateStr, timeStr);

      try {
        if (activeNoteId === null) {
          const res = await fetch(`${API_BASE}/notes`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, content, priority, tag, reminder_at, is_pinned })
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const created = await res.json();
          activeNoteId = created.id;
          showToast("Note saved to vault.");
        } else {
          const res = await fetch(`${API_BASE}/notes/${activeNoteId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, content, priority, tag, reminder_at, is_pinned })
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          showToast("Note updated.");
        }
        await loadNotes(false);
      } catch (err) {
        showToast(`Save failed: ${err.message}`, true);
      }
    }

    async function toggleActiveComplete() {
      if (activeNoteId === null) return;
      const note = allNotes.find(n => n.id === activeNoteId);
      if (!note) return;
      try {
        const res = await fetch(`${API_BASE}/notes/${activeNoteId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ is_completed: !note.is_completed })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadNotes(false);
        showToast(!note.is_completed ? "Marked as completed." : "Reopened note.");
      } catch (err) {
        showToast(`Update failed: ${err.message}`, true);
      }
    }

    async function snoozeActiveNote(minutes) {
      if (activeNoteId === null) return;
      const note = allNotes.find(n => n.id === activeNoteId);
      if (!note) return;
      const base = note.reminder_at ? new Date(note.reminder_at) : new Date();
      const target = new Date(Math.max(base.getTime(), Date.now()) + minutes * 60000);
      try {
        const res = await fetch(`${API_BASE}/notes/${activeNoteId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reminder_at: target.toISOString(), is_completed: false })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        alertedIds.delete(activeNoteId);
        sessionStorage.setItem("cadence_alerted_ids", JSON.stringify([...alertedIds]));
        await loadNotes(false);
        showToast(`Snoozed by ${minutes}m.`);
      } catch (err) {
        showToast(`Snooze failed: ${err.message}`, true);
      }
    }

    async function deleteActiveNote() {
      if (activeNoteId === null) return;
      try {
        const res = await fetch(`${API_BASE}/notes/${activeNoteId}`, { method: "DELETE" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showToast("Note deleted.");
        startNewNote();
        await loadNotes(false);
      } catch (err) {
        showToast(`Delete failed: ${err.message}`, true);
      }
    }

    function updatePreviewUI() {
      const textarea = document.getElementById("docContent");
      const preview = document.getElementById("docPreview");
      const btn = document.getElementById("previewToggleBtn");
      textarea.style.display = isPreviewMode ? "none" : "block";
      preview.style.display = isPreviewMode ? "block" : "none";
      btn.textContent = isPreviewMode ? "Edit" : "Preview";
    }

    function renderMarkdownPreview() {
      const raw = document.getElementById("docContent").value || "";
      let html = escapeHtml(raw)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, `<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>`);
      document.getElementById("docPreview").innerHTML = html || "<span style='color:var(--text-muted)'>Nothing to preview.</span>";
    }

    function togglePreviewMode() {
      isPreviewMode = !isPreviewMode;
      updatePreviewUI();
      if (isPreviewMode) renderMarkdownPreview();
    }

    async function loadNotes(selectFirstIfNone = true) {
      try {
        const res = await fetch(`${API_BASE}/notes`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allNotes = await res.json();
        updateSidebarCounts();
        renderNotesList();
        if (activeNoteId !== null) {
          const exists = allNotes.some(n => n.id === activeNoteId);
          if (exists) selectNote(activeNoteId);
          else startNewNote();
        } else if (selectFirstIfNone && allNotes.length > 0) {
          selectNote(allNotes[0].id);
        }
      } catch (err) {
        document.getElementById("notesFeed").innerHTML =
          `<div class="empty-feed">Failed to load notes: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function checkDueReminders() {
      const now = new Date();
      for (const note of allNotes) {
        if (note.is_completed || !note.reminder_at) continue;
        if (alertedIds.has(note.id)) continue;
        const rem = new Date(note.reminder_at);
        if (rem <= now) {
          alertedIds.add(note.id);
          sessionStorage.setItem("cadence_alerted_ids", JSON.stringify([...alertedIds]));
          playChime();
          showToast(`Reminder due: ${note.title}`);
        }
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        document.getElementById("searchInput").focus();
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        saveActiveNote();
      }
    });

    applyTheme(currentTheme);
    applySoundState();
    loadNotes(true);
    setInterval(checkDueReminders, 15000);
  </script>
</body>
</html>
